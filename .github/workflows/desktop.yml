name: Build desktop apps

# Builds Windows, macOS and Linux installers.
# - Push a tag like v1.0.1 to publish them as a GitHub Release.
# - Or run it by hand from the Actions tab; the files appear under the run's "Artifacts".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            name: windows
          - os: macos-latest
            target: --mac
            name: macos
          - os: ubuntu-latest
            target: --linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # The apps are not code-signed; see README "Opening the app the first time".
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: kuwait-green-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Kuwait Green ${{ github.ref_name }}
          body: |
            ## Download Kuwait Green 🪴

            | Your computer | Download |
            | --- | --- |
            | **Windows** | `Kuwait-Green-…-Windows-Setup.exe` (installer) or `…-Windows-Portable.exe` (no install) |
            | **Mac with Apple chip (M1–M4)** | `Kuwait-Green-…-macOS-arm64.dmg` |
            | **Mac with Intel chip** | `Kuwait-Green-…-macOS-x64.dmg` |
            | **Linux** | `Kuwait-Green-…-Linux.AppImage` or `.deb` |

            **First launch:** the app isn't code-signed yet, so your computer will warn you once.
            - **Windows:** click **More info → Run anyway**.
            - **Mac:** open the app, click **Done**, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
