name: Build desktop apps

# Builds Windows, macOS and Linux installers.
# - Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.1, to publish a GitHub Release.
#   The release is tagged v<version from package.json>; bump the version for each new release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            name: windows
          - os: macos-latest
            target: --mac
            name: macos
          - os: ubuntu-latest
            target: --linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # The apps are not code-signed; see README "Opening the app the first time".
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: kuwait-green-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kuwait Green ${{ steps.tag.outputs.tag }}
          make_latest: true
          body: |
            ## Download Kuwait Green 🪴

            | Your computer | Download |
            | --- | --- |
            | **Windows** | `Kuwait-Green-…-Windows-Setup.exe` (installer) or `…-Windows-Portable.exe` (no install) |
            | **Mac with Apple chip (M1–M4)** | `Kuwait-Green-…-macOS-arm64.dmg` |
            | **Mac with Intel chip** | `Kuwait-Green-…-macOS-x64.dmg` |
            | **Linux** | `Kuwait-Green-…-Linux.AppImage` or `.deb` |

            **First launch:** the app isn't code-signed yet, so your computer will warn you once.
            - **Windows:** click **More info → Run anyway**.
            - **Mac:** open the app, click **Done**, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
